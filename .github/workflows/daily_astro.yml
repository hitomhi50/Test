name: Daily Threads AI Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_REFRESH_ENABLED: ${{ vars.THREADS_REFRESH_ENABLED || 'false' }}
          CONTENT_TOPIC: ${{ vars.CONTENT_TOPIC || 'self-growth and productivity' }}
          CONTENT_TONE: ${{ vars.CONTENT_TONE || 'warm, practical, concise' }}
          CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE || 'Traditional Chinese' }}
          HASHTAGS: ${{ vars.HASHTAGS || '#AI,#DailyThoughts,#Threads' }}
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE || 'auto' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          MAX_POST_CHARS: ${{ vars.MAX_POST_CHARS || '450' }}
          MIN_POST_WORDS: ${{ vars.MIN_POST_WORDS || '25' }}
          MIN_QUALITY_SCORE: ${{ vars.MIN_QUALITY_SCORE || '0.65' }}
          MAX_GENERATION_ATTEMPTS: ${{ vars.MAX_GENERATION_ATTEMPTS || '3' }}
          POSTING_RETRIES: ${{ vars.POSTING_RETRIES || '3' }}
          BANNED_TERMS: ${{ vars.BANNED_TERMS || 'violence,hate,scam,adult' }}
        run: python /home/runner/work/Test/Test/astro_bot.py
